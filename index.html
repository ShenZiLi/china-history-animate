<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>一步千年 · One Step, A Thousand Years</title>
<style>
  :root {
    --ink: #ece4d6;
    --dim: #8e8272;
    --line: rgba(236, 228, 214, 0.16);
    --accent: #b8462c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d0b09; color: var(--ink); }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  #shell { width: min(100vw, calc(100vh * 16 / 9)); display: flex; flex-direction: column; }
  #stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  #stage canvas { width: 100% !important; height: 100% !important; display: block; }
  #loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-size: 14px; letter-spacing: 0.22em;
  }
  #bar {
    display: flex; align-items: center; gap: 18px; padding: 14px 20px 16px;
    border-top: 1px solid var(--line); background: #0d0b09;
  }
  button#play {
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line);
    background: transparent; color: var(--ink); font-size: 13px; cursor: pointer;
    display: grid; place-items: center; transition: background .2s, border-color .2s;
  }
  button#play:hover { background: rgba(236,228,214,.08); border-color: rgba(236,228,214,.34); }
  #scrub { flex: 1; accent-color: var(--accent); height: 3px; cursor: pointer; }
  #time { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--dim); letter-spacing: .04em; white-space: nowrap; }
  #chapter { display: flex; gap: 10px; align-items: baseline; min-width: 300px; font-size: 12px; color: var(--dim); }
  #chapter b { color: var(--ink); font-weight: 500; font-size: 14px; letter-spacing: .06em; }
  #chapter .yr { font-variant-numeric: tabular-nums; opacity: .7; }
  #hint { position: fixed; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 11px; color: #4d453b; letter-spacing: .1em; }
  body.export #bar, body.export #hint { display: none; }
  body.export #shell { width: 1920px; }
  body.export #stage { width: 1920px; height: 1080px; }
  @media (max-width: 720px) {
    #chapter { display: none; }
  }
</style>
</head>
<body>
  <div id="shell">
    <div id="stage"><div id="loading">正在准备…</div></div>
    <div id="bar">
      <button id="play" aria-label="播放">▶</button>
      <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="进度" />
      <div id="time">00:00.00 / 03:11.00</div>
      <div id="chapter"></div>
    </div>
  </div>
  <div id="hint">空格 播放/暂停 · ← → 单秒 · Shift + ← → 五秒 · 0 回到片头</div>

  <script src="./vendor/p5.min.js"></script>
  <script type="module" src="./src/main/player.js"></script>
</body>
</html>
